name: Build Windows Package

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'Releases/build_all.sh'
      - 'Quantum Design DAT Data Visualization Tool.py'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        pip install pyinstaller pandas numpy matplotlib
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "Quantum Design DAT Data Visualization Tool" --distpath "." --exclude-module matplotlib.tests --exclude-module pandas.tests --exclude-module numpy.tests --exclude-module unittest --exclude-module pytest --strip --optimize 2 "Quantum Design DAT Data Visualization Tool.py"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: windows-package
        path: "Quantum Design DAT Data Visualization Tool.exe"
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: "Quantum Design DAT Data Visualization Tool.exe"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
